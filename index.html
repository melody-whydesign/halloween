<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spooky Warp — Typeface Preview</title>

  <style>
    @font-face {
      font-family: "SpookyWarp";
      src:
        url("./SpookyWarpDisplay-Regular.woff2") format("woff2"),
        url("./SpookyWarpDisplay-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --orange: #ff4a00;
      --green: #7bc123;
      --purple: #8f40c5;
      --preview-color: var(--orange);
      --black: #000;
      --panel: #111;
      --panel-2: #070707;
      --border: #2b2b2b;
      --text: #fff;
      --muted: #9d9d9d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--black);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    /* Intentionally NOT the custom font. */
    .site-title {
      margin: 0 0 8px;
      color: var(--orange);
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: clamp(40px, 7vw, 78px);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 0 0 28px;
      color: var(--muted);
      font: 400 15px/1.55 Arial, Helvetica, sans-serif;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: #d2d2d2;
      font: 700 12px/1.2 Arial, Helvetica, sans-serif;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 116px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      color: #fff;
      padding: 16px;
      outline: none;
      font: 500 18px/1.45 Arial, Helvetica, sans-serif;
    }

    textarea:focus,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    .slider-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 18px 0;
    }

    .control-card {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel);
      padding: 15px 16px 14px;
    }

    .value {
      color: var(--orange);
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
    }

    /* Make the control BAR unmistakably visible on all major browsers. */
    input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      height: 32px;
      margin: 1px 0 0;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b3b3b 0%, #666 50%, #3b3b3b 100%);
      border: 1px solid #707070;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -8px;
      border-radius: 50%;
      border: 3px solid #000;
      background: var(--orange);
      box-shadow: 0 0 0 1px var(--orange);
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b3b3b 0%, #666 50%, #3b3b3b 100%);
      border: 1px solid #707070;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #000;
      background: var(--orange);
      box-shadow: 0 0 0 1px var(--orange);
    }

    .range-scale {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
      color: #828282;
      font: 600 11px/1.2 Arial, Helvetica, sans-serif;
    }

    .range-scale span:nth-child(2) { text-align: center; }
    .range-scale span:last-child { text-align: right; }

    .color-options {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 32px;
      margin-top: 4px;
    }

    .color-swatch {
      appearance: none;
      -webkit-appearance: none;
      width: 32px;
      height: 32px;
      margin: 0;
      border: 2px solid #5b5b5b;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      flex: 0 0 auto;
    }

    .color-swatch::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 2px solid transparent;
      border-radius: 50%;
    }

    .color-swatch:checked {
      border-color: #fff;
      box-shadow: 0 0 0 2px #000, 0 0 0 3px #fff;
    }

    .color-swatch:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .color-orange { background: var(--orange); }
    .color-green { background: var(--green); }
    .color-purple { background: var(--purple); }

    .color-code {
      margin-left: auto;
      color: var(--preview-color);
      font-weight: 800;
      text-transform: lowercase;
      letter-spacing: 0;
    }

    .preview-shell {
      position: relative;
      min-height: 390px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .preview-shell svg {
      display: block;
      width: 100%;
      height: clamp(390px, 54vw, 570px);
    }

    #curvePath {
      fill: none;
      stroke: none;
    }

    #previewText {
      fill: var(--preview-color);
      font-family: "SpookyWarp", sans-serif;
      font-size: 108px;
      font-weight: 400;
      letter-spacing: 0.015em;
    }

    .export-row {
      display: flex;
      justify-content: flex-end;
      margin: 16px 0 0;
    }

    .export-button {
      min-height: 44px;
      border: 1px solid var(--orange);
      border-radius: 999px;
      background: var(--orange);
      color: #000;
      padding: 10px 18px;
      cursor: pointer;
      font: 800 13px/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .export-button:hover { filter: brightness(1.08); }

    .export-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .export-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 1120px); padding-top: 28px; }
      .slider-grid { grid-template-columns: 1fr; }
      .preview-shell { min-height: 330px; }
      .preview-shell svg { height: 360px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="site-title">Spooky Warp</h1>
    <p class="intro">Type your own text, then use the controls to resize it, adjust letter spacing, or bend it from a full half-circle down to a full half-circle up.</p>

    <section aria-label="Text input">
      <label class="field-label" for="textInput">Type your text</label>
      <textarea id="textInput" spellcheck="false">HALLOWEEN 2026</textarea>
    </section>

    <section class="slider-grid" aria-label="Typeface controls">
      <div class="control-card">
        <label class="field-label" for="fontSize">
          <span>Font size</span>
          <span class="value"><span id="fontSizeValue">108</span> px</span>
        </label>
        <input id="fontSize" type="range" min="36" max="140" value="108" aria-label="Font size" />
        <div class="range-scale" aria-hidden="true">
          <span>36</span><span>88</span><span>140</span>
        </div>
      </div>

      <div class="control-card">
        <label class="field-label" for="kerningAmount">
          <span>Kerning</span>
          <span class="value"><span id="kerningValue">2</span> px</span>
        </label>
        <input id="kerningAmount" type="range" min="-20" max="60" step="1" value="2" aria-label="Letter spacing from tight minus 20 pixels to wide 60 pixels" />
        <div class="range-scale" aria-hidden="true">
          <span>Tight · −20</span>
          <span>2</span>
          <span>Wide · 60</span>
        </div>
      </div>

      <div class="control-card">
        <label class="field-label" for="curveAmount">
          <span>Text curve</span>
          <span class="value" id="curveValue">Straight · 0°</span>
        </label>
        <input id="curveAmount" type="range" min="-180" max="180" step="1" value="0" aria-label="Text curvature from curve down 180 degrees to curve up 180 degrees" />
        <div class="range-scale" aria-hidden="true">
          <span>Curve down · 180°</span>
          <span>Straight</span>
          <span>Curve up · 180°</span>
        </div>
      </div>

      <div class="control-card">
        <div class="field-label">
          <span>Text color</span>
          <span class="color-code" id="colorValue">#ff4a00</span>
        </div>
        <div class="color-options" role="radiogroup" aria-label="Text color">
          <input class="color-swatch color-orange" type="radio" name="textColor" value="#ff4a00" checked aria-label="Orange #ff4a00" title="Orange #ff4a00" />
          <input class="color-swatch color-green" type="radio" name="textColor" value="#7bc123" aria-label="Green #7bc123" title="Green #7bc123" />
          <input class="color-swatch color-purple" type="radio" name="textColor" value="#8f40c5" aria-label="Purple #8f40c5" title="Purple #8f40c5" />
        </div>
      </div>
    </section>

    <section class="preview-shell" aria-label="Typeface preview">
      <svg viewBox="0 0 1200 620" role="img" aria-labelledby="previewTitle previewDesc" preserveAspectRatio="xMidYMid meet">
        <title id="previewTitle">Spooky Warp text preview</title>
        <desc id="previewDesc">The typed text follows a curve controlled by the Text curve slider.</desc>
        <defs>
          <path id="curvePath" d="M 160 600 L 1040 600" />
        </defs>
        <text id="previewText" text-anchor="middle">
          <textPath id="textOnPath" href="#curvePath" startOffset="50%">HALLOWEEN 2026</textPath>
        </text>
      </svg>
    </section>

    <div class="export-row">
      <button class="export-button" id="exportSvg" type="button">Export SVG</button>
    </div>
  </main>

  <script>
    (() => {
      const input = document.getElementById("textInput");
      const textOnPath = document.getElementById("textOnPath");
      const previewText = document.getElementById("previewText");
      const curvePath = document.getElementById("curvePath");
      const fontSize = document.getElementById("fontSize");
      const fontSizeValue = document.getElementById("fontSizeValue");
      const curveAmount = document.getElementById("curveAmount");
      const curveValue = document.getElementById("curveValue");
      const kerningAmount = document.getElementById("kerningAmount");
      const kerningValue = document.getElementById("kerningValue");
      const exportSvg = document.getElementById("exportSvg");
      const colorOptions = Array.from(document.querySelectorAll('input[name="textColor"]'));
      const colorValue = document.getElementById("colorValue");
      let selectedColor = "#ff4a00";

      // The preview keeps a permanent "safe area" inside the visible box.
      // Text is automatically scaled down only when necessary, so no glyph can
      // cross the preview border or sit directly against it.
      const svgWidth = 1200;
      const svgHeight = 620;
      const safePaddingX = 74;
      const safePaddingY = 56;
      const safeBox = {
        x: safePaddingX,
        y: safePaddingY,
        width: svgWidth - (safePaddingX * 2),
        height: svgHeight - (safePaddingY * 2)
      };
      let fitFrame = 0;

      function sanitizeText(value) {
        return value
          .toUpperCase()
          .replace(/[^A-Z0-9 \n]/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function updateText() {
        const clean = sanitizeText(input.value);
        textOnPath.textContent = clean || "TYPE SOMETHING";
        updateCurve();
      }

      function getFontSize() {
        return Math.max(36, Math.min(140, Number(fontSize.value) || 108));
      }

      function updateFontSize() {
        const size = getFontSize();
        previewText.style.fontSize = `${size}px`;
        fontSizeValue.textContent = String(size);
        updateCurve();
      }

      function getKerning() {
        return Math.max(-20, Math.min(60, Number(kerningAmount.value) || 0));
      }

      function updateKerning() {
        const spacing = getKerning();
        previewText.style.letterSpacing = `${spacing}px`;
        kerningValue.textContent = String(spacing);
        updateCurve();
      }

      function updateColor(value) {
        const allowed = new Set(["#ff4a00", "#7bc123", "#8f40c5"]);
        selectedColor = allowed.has(value) ? value : "#ff4a00";
        document.documentElement.style.setProperty("--preview-color", selectedColor);
        colorValue.textContent = selectedColor;
        colorValue.style.color = selectedColor;
      }

      function estimateTextWidth(size) {
        const text = textOnPath.textContent || "TYPE SOMETHING";
        const spacing = getKerning();
        const canvas = estimateTextWidth.canvas || (estimateTextWidth.canvas = document.createElement("canvas"));
        const context = canvas.getContext("2d");
        const fallbackWidth = text.length * size * 0.62;
        const glyphWidth = context
          ? (context.font = `${size}px SpookyWarp, sans-serif`, context.measureText(text).width)
          : fallbackWidth;
        const spacingWidth = Math.max(0, text.length - 1) * spacing;
        return Math.max(1, glyphWidth + spacingWidth);
      }

      function scheduleFit() {
        cancelAnimationFrame(fitFrame);
        fitFrame = requestAnimationFrame(fitPreviewText);
      }

      function fitPreviewText() {
        // Measure in the font's natural geometry first.
        previewText.removeAttribute("transform");

        let box;
        try {
          box = previewText.getBBox();
        } catch (error) {
          return;
        }

        if (!box || !Number.isFinite(box.width) || !Number.isFinite(box.height) || box.width <= 0 || box.height <= 0) {
          return;
        }

        // Uniformly shrink only when the rendered text would leave the safe
        // area. This preserves the letterforms and the selected curve shape.
        const scale = Math.min(
          1,
          safeBox.width / box.width,
          safeBox.height / box.height
        );

        const cx = box.x + (box.width / 2);
        const cy = box.y + (box.height / 2);
        const scaledLeft = cx + (box.x - cx) * scale;
        const scaledRight = cx + ((box.x + box.width) - cx) * scale;
        const scaledTop = cy + (box.y - cy) * scale;
        const scaledBottom = cy + ((box.y + box.height) - cy) * scale;

        let dx = 0;
        let dy = 0;
        const safeRight = safeBox.x + safeBox.width;
        const safeBottom = safeBox.y + safeBox.height;

        if (scaledLeft < safeBox.x) dx += safeBox.x - scaledLeft;
        if (scaledRight > safeRight) dx += safeRight - scaledRight;
        if (scaledTop < safeBox.y) dy += safeBox.y - scaledTop;
        if (scaledBottom > safeBottom) dy += safeBottom - scaledBottom;

        if (scale < 0.9999 || Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
          previewText.setAttribute(
            "transform",
            `translate(${(cx + dx).toFixed(3)} ${(cy + dy).toFixed(3)}) scale(${scale.toFixed(6)}) translate(${-cx.toFixed(3)} ${-cy.toFixed(3)})`
          );
        }
      }

      function updateCurve() {
        const degrees = Math.max(-180, Math.min(180, Number(curveAmount.value) || 0));
        const magnitude = Math.abs(degrees);
        const size = getFontSize();
        const measuredWidth = estimateTextWidth(size);

        // Give the text path enough raw length that long strings are laid out
        // completely before the final fit step scales them into the safe box.
        const baseChord = safeBox.width;

        if (magnitude < 0.5) {
          const chord = Math.max(baseChord, measuredWidth * 1.12);
          const x1 = (svgWidth - chord) / 2;
          const x2 = (svgWidth + chord) / 2;
          const baselineY = (svgHeight / 2) + (size * 0.30);
          curvePath.setAttribute("d", `M ${x1.toFixed(2)} ${baselineY.toFixed(2)} L ${x2.toFixed(2)} ${baselineY.toFixed(2)}`);
          curveValue.textContent = "Straight · 0°";
          scheduleFit();
          return;
        }

        const theta = magnitude * Math.PI / 180;
        const sinHalf = Math.sin(theta / 2);
        const requiredArcLength = measuredWidth * 1.12;
        const chordForText = theta > 0.0001
          ? requiredArcLength * (2 * sinHalf) / theta
          : requiredArcLength;
        const chord = Math.max(baseChord, chordForText);
        const sagitta = (chord / 2) * Math.tan(theta / 4);

        const x1 = (svgWidth - chord) / 2;
        const x2 = (svgWidth + chord) / 2;
        const baselineShift = size * 0.30;
        const baselineY = degrees > 0
          ? (svgHeight / 2) + (sagitta / 2) + baselineShift
          : (svgHeight / 2) - (sagitta / 2) + baselineShift;

        const radius = chord / (2 * sinHalf);
        const sweepFlag = degrees > 0 ? 0 : 1; // positive = up, negative = down

        curvePath.setAttribute(
          "d",
          `M ${x1.toFixed(3)} ${baselineY.toFixed(3)} A ${radius.toFixed(3)} ${radius.toFixed(3)} 0 0 ${sweepFlag} ${x2.toFixed(3)} ${baselineY.toFixed(3)}`
        );

        curveValue.textContent = degrees > 0
          ? `Curve up · ${magnitude}°`
          : `Curve down · ${magnitude}°`;
        scheduleFit();
      }


      // Vector outlines extracted from SpookyWarpDisplay-Regular.ttf.
      // Each SVG export uses these paths, so the downloaded artwork does not
      // depend on the font being installed or embedded on another computer.

 209V218H195L191 214H182L172 205H168L141 173L136 146L131 141V100L136 96V82L150 55L182 23H186L195 14H204L232 0H304L309 5H323L386 32L423 64H427L432 73L464 105V109L491 146L532 232V241L546 273L555 323L559 328V350L564 355V391L568 396V501L564 505V537L559 542V560L555 564V578L550 583V596L541 610V619L514 669L482 705H477L450 728L423 742H414L382 755H364ZM336 610 354 601 373 583 386 560V546L391 542V505L373 464L332 428L314 419H300L295 414H254L222 428L204 446L191 473V519L195 523L200 542L209 551V555L259 601H268L286 610Z"};
      const fontUnitsPerEm = 1000;

      function escapeXml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function nextPaint() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      function buildOutlinedSvg() {
        const text = textOnPath.textContent || "TYPE SOMETHING";
        const size = getFontSize();
        const scale = size / fontUnitsPerEm;
        const paths = [];
        const count = Math.min(text.length, previewText.getNumberOfChars());

        for (let i = 0; i < count; i += 1) {
          const char = text[i];
          const d = glyphOutlines[char];
          if (!d) continue; // spaces contain no visible outline

          let point;
          let rotation;
          try {
            point = previewText.getStartPositionOfChar(i);
            rotation = previewText.getRotationOfChar(i);
          } catch (error) {
            continue;
          }

          if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) continue;
          if (!Number.isFinite(rotation)) rotation = 0;

          paths.push(
            `<path d="${escapeXml(d)}" transform="translate(${point.x.toFixed(4)} ${point.y.toFixed(4)}) rotate(${rotation.toFixed(4)}) scale(${scale.toFixed(7)} ${(-scale).toFixed(7)})"/>`
          );
        }

        // fitPreviewText may apply a uniform scale/translation to keep the text
        // inside the preview's safe area. Reuse that exact transform so the
        // exported vector matches what the user sees.
        const fitTransform = previewText.getAttribute("transform") || "";
        const transformAttribute = fitTransform
          ? ` transform="${escapeXml(fitTransform)}"`
          : "";

        return `<?xml version="1.0" encoding="UTF-8"?>
` +
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgWidth} ${svgHeight}" width="${svgWidth}" height="${svgHeight}">
` +
          `  <title>${escapeXml(text)} — Spooky Warp</title>
` +
          `  <g fill="${escapeXml(selectedColor)}"${transformAttribute}>
    ${paths.join("\n    ")}
  </g>
` +
          `</svg>
`;
      }

      async function exportOutlinedSvg() {
        const originalLabel = exportSvg.textContent;
        exportSvg.disabled = true;
        exportSvg.textContent = "Preparing SVG…";

        try {
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          updateCurve();
          scheduleFit();
          await nextPaint();

          const svgSource = buildOutlinedSvg();
          const blob = new Blob([svgSource], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          const nameSource = (textOnPath.textContent || "spooky-warp")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 48) || "spooky-warp";

          anchor.href = url;
          anchor.download = `${nameSource}.svg`;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          exportSvg.textContent = "SVG exported";
          setTimeout(() => { exportSvg.textContent = originalLabel; }, 1200);
        } catch (error) {
          console.error(error);
          exportSvg.textContent = "Export failed";
          setTimeout(() => { exportSvg.textContent = originalLabel; }, 1600);
        } finally {
          exportSvg.disabled = false;
        }
      }

      exportSvg.addEventListener("click", exportOutlinedSvg);

      input.addEventListener("input", updateText);
      fontSize.addEventListener("input", updateFontSize);
      curveAmount.addEventListener("input", updateCurve);
      kerningAmount.addEventListener("input", updateKerning);
      colorOptions.forEach(option => {
        option.addEventListener("change", () => {
          if (option.checked) updateColor(option.value);
        });
      });

      updateColor("#ff4a00");
      updateText();
      updateFontSize();
      updateKerning();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          updateCurve();
          scheduleFit();
        });
      }
    })();
